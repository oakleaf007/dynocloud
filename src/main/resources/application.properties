spring.application.name=DynoCloud

spring.profiles.active=local
spring.mvc.async.request-timeout=0


#garage & aws config
garage.endpoint=${GARAGE_ENDPOINT}
garage.region=${GARAGE_REGION}
garage.access-key=${GARAGE_ACCESS_KEY}
garage.secret-key=${GARAGE_SECRET_KEY}
garage.bucket=${BUCKET}
storage.provider=${S3PROVIDER}
aws.s3.region=${AWS_REGION}
dynocloud.encryption.kek=${KEK}


dynocloud.storage.default-quota-gb=2

spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

#Admin access

dynocloud.admin.key=${ADMIN_KEY}

# OpenBao configuration
dynocloud.kms.openbao.address=${OPENBAO_ADDR:http://localhost:8200}
dynocloud.kms.openbao.role-id=${OPENBAO_ROLE_ID}
dynocloud.kms.openbao.secret-id=${OPENBAO_SECRET_ID}
dynocloud.kms.openbao.key-name=dynocloud-kek